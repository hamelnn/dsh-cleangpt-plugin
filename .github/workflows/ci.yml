name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm test
      - name: Install isolated DSH browser regression runtime
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/dsh-runtime" --ignore-scripts --registry=https://registry.npmjs.org @deepseek-ai/dsh@0.2.1-rc.2 playwright@1.64.1 pnpm@11.19.0
      - name: Packed install, upgrade and removal preserve user state
        env:
          DSH_TEST_RUNTIME: ${{ runner.temp }}/dsh-runtime
        run: npm run test:install
      - name: Install Chromium
        shell: bash
        run: node "$RUNNER_TEMP/dsh-runtime/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Packed clean install and synthetic native UI regression
        env:
          DSH_TEST_RUNTIME: ${{ runner.temp }}/dsh-runtime
          DSH_TEST_ARTIFACTS: ${{ runner.temp }}/cleangpt-artifacts
        run: npm run test:ui
  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm run pack:plugin
      - name: Downloadable precompiled plugin (no release or npm publish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-cleangpt-plugin-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
